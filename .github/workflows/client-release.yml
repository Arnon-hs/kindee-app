name: Client checks and preview release
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kindee-client-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      KINDEE_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        id: install
      - name: Report full lint backlog
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Reject warnings in changed source
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint:changed -- --base "$KINDEE_DIFF_BASE"
      - name: Reject dead code
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run deadcode:check
      - name: Reject qualifying clones
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run dup
  web:
    runs-on: ubuntu-latest
    env:
      KINDEE_PUBLIC_DEMO: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run api:check
      - run: npm run api:check:server
      - run: npm run build
      - run: npm test
      - run: npm run test:state
      - uses: actions/upload-artifact@v4
        with:
          name: pwa-demo
          path: dist
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm run build:android
      - name: Prepare named debug APKs
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/KinDee-android-debug.apk
          cp android/wear/build/outputs/apk/debug/wear-debug.apk release/KinDee-wearos-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: release/*.apk
          if-no-files-found: error
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:'))
    needs: [web, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-debug
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: pwa-demo
          path: pwa-demo
      - name: Package and publish the verified preview build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          zip -rq release/KinDee-pwa-demo.zip pwa-demo
          cd release
          sha256sum *.apk *.zip > SHA256SUMS
          cd ..
          if gh release view v0.3.0-preview.1 >/dev/null 2>&1; then
            echo 'Preview release already exists; leaving its assets unchanged.'
            exit 0
          fi
          gh release create v0.3.0-preview.1 release/* --prerelease --target "$RELEASE_TARGET" --title 'KinDee 0.3.0 MVP preview 1' --notes-file docs/RELEASE_0.3.0-preview.1.md
